name: Tidal Atlas studio
on:
  push:
    paths: ['studio/**', 'geometry/kinetic*.py', 'geometry/choreography.py', 'geometry/__init__.py', 'geometry/base_field.py', 'geometry/implicit_curve.py', 'scene_management/scene_manager.py', 'tests/studio/**', 'examples/tidal_atlas_recipe.json', 'examples/tidal_atlas_choreography.json', 'pyproject.toml', 'uv.lock', 'package.json', 'package-lock.json', 'playwright.config.mjs', '.github/workflows/studio.yml']
  pull_request:
    paths: ['studio/**', 'geometry/kinetic*.py', 'geometry/choreography.py', 'geometry/__init__.py', 'geometry/base_field.py', 'geometry/implicit_curve.py', 'scene_management/scene_manager.py', 'tests/studio/**', 'examples/tidal_atlas_recipe.json', 'examples/tidal_atlas_choreography.json', 'pyproject.toml', 'uv.lock', 'package.json', 'package-lock.json', 'playwright.config.mjs', '.github/workflows/studio.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-scene-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: python -m pip install -e '.[studio,dev]'
      - run: python -m ruff check studio geometry/kinetic*.py geometry/choreography.py geometry/__init__.py geometry/base_field.py geometry/implicit_curve.py scene_management/scene_manager.py tests/studio
      - run: python -m ruff format --check studio geometry/kinetic*.py geometry/choreography.py geometry/__init__.py geometry/base_field.py geometry/implicit_curve.py scene_management/scene_manager.py tests/studio
      - run: python -m pytest tests -v
      - run: node tests/studio/webmcp_contract.mjs
      - run: npm ci
      - run: npm run test:ui

  real-chromium:
    name: Real Chromium UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install the local studio and locked browser-test dependencies
        run: |
          python -m pip install -e '.[studio]'
          npm ci
      - name: Install the pinned Playwright Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise the real browser against an ephemeral local scene
        run: npm run test:browser
      - name: Preserve screenshots, downloads, videos, traces, and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidal-atlas-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/browser/
          retention-days: 14
          if-no-files-found: warn
