name: Tidal Atlas studio
on:
  push:
    paths: ['studio/**', 'benchmarks/studio-browser.mjs', 'benchmarks/installation-smoke.py', 'geometry/**', 'tests/test_backend_numerics.py', 'tests/test_procedural_derivatives.py', 'benchmarks/procedural_accuracy.py', 'benchmarks/sublevel_bounds.py', 'benchmarks/automatic_derivatives.py', 'tests/test_automatic_derivatives.py', 'tests/test_field_algebra.py', 'tests/test_occupancy_validity.py', 'tests/test_field_strategy.py', 'tests/test_field_optimization.py', 'benchmarks/occupancy_validity.py', 'benchmarks/verify_lock_artifacts.py', 'benchmarks/distance_cache.py', 'benchmarks/distance_numerics.py', 'tests/test_distance_numerics.py', 'tests/test_distance_sign.py', 'tests/test_distance_gradient.py', 'benchmarks/distance_gradient.py', 'benchmarks/distance_sign_performance.py', 'tests/test_distance_cache.py', 'tests/test_base_field.py', 'benchmarks/field_algebra.py', 'tests/test_sublevel_bounds.py', 'benchmarks/implicit_backend.py', 'scene_management/scene_manager.py', 'tests/studio/**', 'examples/tidal_atlas_recipe.json', 'examples/tidal_atlas_choreography.json', 'examples/tidal_atlas_confluence.json', 'examples/tidal_atlas_layers.json', 'pyproject.toml', 'uv.lock', 'package.json', 'package-lock.json', 'playwright.config.mjs', '.github/workflows/studio.yml']
  pull_request:
    paths: ['studio/**', 'benchmarks/studio-browser.mjs', 'benchmarks/installation-smoke.py', 'geometry/**', 'tests/test_backend_numerics.py', 'tests/test_procedural_derivatives.py', 'benchmarks/procedural_accuracy.py', 'benchmarks/sublevel_bounds.py', 'benchmarks/automatic_derivatives.py', 'tests/test_automatic_derivatives.py', 'tests/test_field_algebra.py', 'tests/test_occupancy_validity.py', 'tests/test_field_strategy.py', 'tests/test_field_optimization.py', 'benchmarks/occupancy_validity.py', 'benchmarks/verify_lock_artifacts.py', 'benchmarks/distance_cache.py', 'benchmarks/distance_numerics.py', 'tests/test_distance_numerics.py', 'tests/test_distance_sign.py', 'tests/test_distance_gradient.py', 'benchmarks/distance_gradient.py', 'benchmarks/distance_sign_performance.py', 'tests/test_distance_cache.py', 'tests/test_base_field.py', 'benchmarks/field_algebra.py', 'tests/test_sublevel_bounds.py', 'benchmarks/implicit_backend.py', 'scene_management/scene_manager.py', 'tests/studio/**', 'examples/tidal_atlas_recipe.json', 'examples/tidal_atlas_choreography.json', 'examples/tidal_atlas_confluence.json', 'examples/tidal_atlas_layers.json', 'pyproject.toml', 'uv.lock', 'package.json', 'package-lock.json', 'playwright.config.mjs', '.github/workflows/studio.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-wheel:
    name: Clean wheel startup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build an isolated wheel and install only declared runtime dependencies
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/2top-clean-venv"
          python -c "import glob,os,subprocess; subprocess.check_call([os.path.join(os.environ['RUNNER_TEMP'],'2top-clean-venv','bin','python'),'-m','pip','install',glob.glob('dist/twotop-*.whl')[0]+'[studio]'])"
          "$RUNNER_TEMP/2top-clean-venv/bin/python" -m pip check
      - name: Verify outside-checkout startup, packaged assets and real read-only MCP
        run: '"$RUNNER_TEMP/2top-clean-venv/bin/python" benchmarks/installation-smoke.py --require-wheel --output installation-results'
      - name: Preserve installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidal-atlas-clean-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: installation-results/
          retention-days: 14
          if-no-files-found: warn

  shared-scene-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: python -m pip install -e '.[studio,dev]'
      - run: python -m ruff check studio geometry/kinetic*.py geometry/choreography.py geometry/static_blend.py geometry/__init__.py geometry/base_field.py geometry/composite_curve.py geometry/implicit_curve.py geometry/numeric.py geometry/differentiation.py geometry/adaptive_differentiation.py geometry/field_algebra.py geometry/field_strategy.py geometry/bounds.py geometry/level_set_curve.py geometry/curve_intersections.py geometry/procedural_curve.py geometry/rfunction_curve.py tests/test_backend_numerics.py tests/test_procedural_derivatives.py benchmarks/procedural_accuracy.py benchmarks/sublevel_bounds.py tests/test_sublevel_bounds.py benchmarks/automatic_derivatives.py tests/test_automatic_derivatives.py tests/test_field_algebra.py tests/test_occupancy_validity.py tests/test_field_strategy.py tests/test_field_optimization.py benchmarks/occupancy_validity.py benchmarks/verify_lock_artifacts.py benchmarks/distance_cache.py benchmarks/distance_numerics.py tests/test_distance_numerics.py geometry/distance_gradient.py tests/test_distance_gradient.py benchmarks/distance_gradient.py tests/test_distance_sign.py benchmarks/distance_sign_performance.py tests/test_distance_cache.py tests/test_base_field.py benchmarks/field_algebra.py benchmarks/implicit_backend.py scene_management/scene_manager.py tests/studio
      - run: python -m ruff format --check studio geometry/kinetic*.py geometry/choreography.py geometry/static_blend.py geometry/__init__.py geometry/base_field.py geometry/composite_curve.py geometry/implicit_curve.py geometry/numeric.py geometry/differentiation.py geometry/adaptive_differentiation.py geometry/field_algebra.py geometry/field_strategy.py geometry/bounds.py geometry/level_set_curve.py geometry/curve_intersections.py geometry/procedural_curve.py geometry/rfunction_curve.py tests/test_backend_numerics.py tests/test_procedural_derivatives.py benchmarks/procedural_accuracy.py benchmarks/sublevel_bounds.py tests/test_sublevel_bounds.py benchmarks/automatic_derivatives.py tests/test_automatic_derivatives.py tests/test_field_algebra.py tests/test_occupancy_validity.py tests/test_field_strategy.py tests/test_field_optimization.py benchmarks/occupancy_validity.py benchmarks/verify_lock_artifacts.py benchmarks/distance_cache.py benchmarks/distance_numerics.py tests/test_distance_numerics.py geometry/distance_gradient.py tests/test_distance_gradient.py benchmarks/distance_gradient.py tests/test_distance_sign.py benchmarks/distance_sign_performance.py tests/test_distance_cache.py tests/test_base_field.py benchmarks/field_algebra.py benchmarks/implicit_backend.py scene_management/scene_manager.py tests/studio
      - run: python benchmarks/verify_lock_artifacts.py --package h11
      - run: python -m pytest tests -v
      - run: node tests/studio/webmcp_contract.mjs
      - run: npm ci
      - run: npm run test:ui

  real-chromium:
    name: Real Chromium UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install the local studio and locked browser-test dependencies
        run: |
          python -m pip install -e '.[studio]'
          npm ci
      - name: Install the pinned Playwright Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise the real browser against an ephemeral local scene
        run: npm run test:browser
      - name: Preserve screenshots, downloads, videos, traces, and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidal-atlas-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/browser/
          retention-days: 14
          if-no-files-found: warn
