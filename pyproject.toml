[project]
name = "twotop"
version = "0.7.2"
description = "2Top Implicit Geometry Engine and Tidal Atlas studio"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sympy>=1.12",
    "matplotlib>=3.6.0"
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "pydantic>=2.13,<3",
    "mcp==2.3.0",
    "httpx>=0.28,<1",
]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-benchmark>=5", "ruff>=0.17", "jsonschema>=4"]

[project.scripts]
twotop-studio = "studio.app:main"
twotop-mcp = "studio.mcp_server:main"

[tool.setuptools.packages.find]
include = ["geometry*", "scene_management*", "graphics_backend*", "visual_tests*", "studio*"]
namespaces = false

[tool.setuptools.package-data]
studio = ["static/*.html", "static/*.css", "static/*.js"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"



[tool.ruff]
# Like Black, respect line length.
line-length = 88

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

[tool.ruff.lint]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Note: We could be more selective and only enable the specific rules we want,
# but for now, we'll use the default set and add a few customizations.
select = ["E", "F"]
extend-ignore = [
    # Allow unused variables in test files
    "F841",
    # Ignore line too long warnings (E501)
    "E501",
    # Ignore module level import not at top of file (E402)
    "E402",
]

[tool.black]
line-length = 88
target-version = ['py311']
